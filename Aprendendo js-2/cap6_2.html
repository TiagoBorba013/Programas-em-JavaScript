<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style_cap6.css">
    <link rel="icon" type="image/webp" href="imgs/Descubra-num.png">
    <title>Document</title>
</head>
<body>
     <img src="imgs/Descubra-num.png" class="normal" alt="Jogo dos números">

     <h1>Descubra o número</h1>

     <form>
       <p>
        Número:
        <input type="number" min="1" max="100" id="inNumero" required autofocus>
        <input type="submit" value="Apostar" id="btnSubmit">
        <input type="button" value="Jogar Novamente" id="btnNovo" class="oculta">
       </p>
     </form>
    
     <h3>
        Erros: <span id="outErros">0</span>
     </h3>
     <h3>
        Chances: <span id="outChances">6</span>
     </h3>
     <h3 id="outDica" class="italico">Dica: É um número entre 1 e 100</h3>
     
     <script src="cap6_2.js"></script>
    

</body>
</html>
