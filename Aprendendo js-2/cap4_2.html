<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
   <link rel="icon" type="image/webp" href="imgs/balança.webp">
    <title>Peso ideal</title>
</head>
<body>
    <img src="imgs/balança.webp" alt="imagem_programa">

    <h1>Programa Calculo de Peso Ideal</h1>

    <form>
        <p>
            Nome:
            <input type="text" id="nome" required>
        </p>
        <p>
            Sexo:
            <input type="radio" name="sexo" id="masculino" required>Masculino
            <input type="radio" name="sexo" id="feminino" required>Feminino
        </p>
        <p>
            Altura:
            <input type="number" id="tam" min="0" step="0.01" required>
        </p>
        <input type="submit" value="Calcular peso Ideal">
        <input type="reset" value="Limpar Campos">
        
    </form>
    
    <h3></h3>

    <script src="cap4_2.js"></script>
</body>
</html>
